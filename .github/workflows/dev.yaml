name: 🚀 Deploy to Server

on:
  push:
    branches: [main]

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: 📥 Checkout do repositório
        uses: actions/checkout@v4

      - name: 🔒 Conectar via SSH e implantar
        uses: appleboy/ssh-action@master
        with:
          host: ${{ secrets.SERVER_IP }}
          username: ${{ secrets.SERVER_USERNAME }}
          password: ${{ secrets.SERVER_PASSWORD }}
          timeout: 20m
          script: |
            set -e

            echo "📁 Acessando diretório do projeto"
            cd /root/projects/ujc-repo-backend

            echo "🔄 Atualizando repositório"
            if [ -d ".git" ]; then
              git pull
            else
              git clone https://github.com/${{ github.repository }}.git .
            fi

            echo "⚙️ Atualizando .env"
            cat > .env << EOL
            DATABASE_URL=postgresql://postgres:secret@postgres:5432/ujc_repo_db
            DATABASE_USER=postgres
            DATABASE_PASSWORD=secret
            DATABASE_HOST=postgres
            DATABASE_PORT=5432
            DATABASE_NAME=ujc_repo_db
            TOKEN_SECRET="37e9d619923e33d16a4f521d2389121feeb29be23njn479cf2cb80e97b62f0bde71c7938029l2k8291k"

            PORT=4002
            BASE_URL=http://${{ secrets.SERVER_IP }}:4002
            EOL

            echo "🧹 Limpando cache do Docker antes do build"
            docker builder prune -f || true

            echo "📦 Buildando aplicação (com retry em caso de falha)"
            if ! docker compose build ujc-repo; then
              echo "⚠️ Primeira tentativa de build falhou, tentando novamente..."
              sleep 10
              docker compose build ujc-repo --no-cache
            fi

            echo "🧱 Executando migrations"
            docker compose run --rm ujc-repo-backend yarn migrate

            echo "🚀 Subindo aplicação"
            docker compose up -d

            echo "✅ Verificando status"
            sleep 10  # Aguarda um pouco para o container inicializar
            if ! docker compose ps | grep -q ujc-repo; then
              echo "❌ Erro: container não está rodando"
              docker compose logs ujc-repo
              exit 1
            fi

            echo "🧹 Limpando imagens antigas"
            docker system prune -f