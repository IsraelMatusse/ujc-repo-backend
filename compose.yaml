services:
  ujc_repo:
    build: .
    ports:
      - "${APP_PORT}:${APP_INTERNAL_PORT}"
    env_file: 
      - .env
    volumes:
      - uploads:/usr/src/app/uploads
      - ./logs:/usr/src/app/logs
    depends_on:
      db:
        condition: service_healthy 
    command: sh -c "yarn prisma migrate deploy && yarn dev"
    networks:
      - ujcreponet
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:${APP_INTERNAL_PORT}/v1/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

  db:
    image: postgres:${POSTGRES_VERSION:-15-alpine} 
    container_name: ${POSTGRES_CONTAINER_NAME}
    env_file: 
      - .env
    networks:
      - ujcreponet
    volumes:
      - dbdata:/var/lib/postgresql/data
    ports:
      - "${DATABASE_EXTERNAL_PORT}:5432"
    restart: always
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 5

networks:
  ujcreponet:
    driver: bridge

volumes:
  uploads:
  dbdata: